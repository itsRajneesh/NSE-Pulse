version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nse-screener-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - nse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nse-screener-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - nse-net

networks:
  nse-net:
    driver: bridge
